services:
  auditor:
    build:
      context: .
    init: true
    working_dir: /workspace
    user: "${AUDITOR_UID:-1000}:${AUDITOR_GID:-1000}"
    ports:
      - "127.0.0.1:${AUDITOR_PORT:-6767}:6767"
    volumes:
      - type: bind
        source: ${AUDIT_SOURCE_DIR:-.}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6767/api/session', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
